<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libirynth</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./lib.js" defer></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">My Library</a></li>
            <li><a href="">About</a></li>
        </ul>
        <h1>Libirynth</h1>
        <div class="profile-container">
            <div class="profile">
                <img src="./img/Gemini_Generated_Image_wndrhhwndrhhwndr.png" alt="profile picture">
                <p>Anthony Beechworth</p>
            </div>
        </div>
    </nav>
    <header>
        <h2>Your Collection</h2>
    </header>
    <main>
        <div class="book-card">
            <div class="cover">
                <button type="button" class="add-book" command="show-modal" commandfor="add-book-dialog">+</button>
            </div>
            <div class="fields">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <div class="book-card">
            <div class="cover">
                <div class="bookmark read">Not Read</div>
            </div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div>
    </main>
    <aside>
        <fieldset>
            <div><input type="checkbox" id="filter-1" name="filters" value="filter-1"><label for="filter-1">category-1</label></div>
            <div><input type="checkbox" id="filter-2" name="filters" value="filter-2"><label for="filter-2">category-2</label></div>
            <div><input type="checkbox" id="filter-3" name="filters" value="filter-3"><label for="filter-3">category-3</label></div>
            <div><input type="checkbox" id="filter-4" name="filters" value="filter-4"><label for="filter-4">category-4</label></div>
            <div><input type="checkbox" id="filter-5" name="filters" value="filter-5"><label for="filter-5">category-5</label></div>
        </fieldset>
    </aside>
    <dialog id="add-book-dialog">
        <form action="" method="dialog">
            <div>
                <h3>Add a book</h2>
                <button type="button" command="close" commandfor="add-book-dialog">❌</button>
            </div>
            <div><label for="title">Title</label><input type="text" id="title"  name="title" required="required" minlength="1" maxlength="150"></div>
            <div><label for="author">Author</label><input type="text" id="author" name="author" required="required" minlength="1" maxlength="150"></div>
            <div>
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="biography">Biography</option>
                    <option value="children's-tales">Children's Tales</option>
                    <option value="classic">Classic</option>
                    <option value="crime">Crime</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="history">History</option>
                    <option value="mystery">Mystery</option>
                    <option value="thriller">Thriller</option>
                    <option value="romance">Romance</option>
                    <option value="self-help">Self-help</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div><label for="pages">No. of Pages</label><input type="number" id="pages" name="pages" required="required" min="1"></div>
            <div><input type="checkbox" id="read" name="read" value="true"><label for="read">I have read the book</label></div>
            <button type="submit">Submit</button>
        </form>
    </dialog>
</body>
</html>
