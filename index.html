<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libirynth</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./lib.js" defer></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">My Library</a></li>
            <li><a href="">About</a></li>
        </ul>
        <h1>Libirynth</h1>
        <div class="profile-container">
            <div class="profile">
                <img src="./img/Gemini_Generated_Image_wndrhhwndrhhwndr.png" alt="profile picture">
                <p>Anthony Beechworth</p>
            </div>
        </div>
    </nav>
    <header>
        <h2>Your Collection</h2>
    </header>
    <main>
        <div class="book-card adder">
            <div class="cover">
                <button type="button" class="add-book" command="show-modal" commandfor="add-book-dialog">+</button>
            </div>
            <div class="fields">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <!-- <div class="book-card">
            <div class="cover">
                <div class="bookmark read">Not Read</div>
            </div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div>
        <div class="book-card">
            <div class="cover"></div>
            <div class="fields"></div>
        </div> -->
    </main>
    <aside>
        <fieldset>
            <div><input type="checkbox" id="biography" name="filters" value="biography"><label for="biography">biography</label></div>
            <div><input type="checkbox" id="children's-tales" name="filters" value="children's-tales"><label for="children's-tales">children's-tales</label></div>
            <div><input type="checkbox" id="classic" name="filters" value="classic"><label for="classic">classic</label></div>
            <div><input type="checkbox" id="crime" name="filters" value="crime"><label for="crime">crime</label></div>
            <div><input type="checkbox" id="fantasy" name="filters" value="fantasy"><label for="fantasy">fantasy</label></div>
            <div><input type="checkbox" id="history" name="filters" value="history"><label for="history">history</label></div>
            <div><input type="checkbox" id="mystery" name="filters" value="mystery"><label for="mystery">mystery</label></div>
            <div><input type="checkbox" id="thriller" name="filters" value="thriller"><label for="thriller">thriller</label></div>
            <div><input type="checkbox" id="romance" name="filters" value="romance"><label for="romance">romance</label></div>
            <div><input type="checkbox" id="sci-fi" name="filters" value="sci-fi"><label for="sci-fi">sci-fi</label></div>
            <div><input type="checkbox" id="self-help" name="filters" value="self-help"><label for="self-help">self-help</label></div>
            <div><input type="checkbox" id="other" name="filters" value="other"><label for="other">other</label></div>
        </fieldset>
    </aside>
    <dialog id="add-book-dialog" closedby="none">
        <form action="" method="dialog" id="add-book-form">
            <div>
                <h3>Add a book</h2>
                <button type="button" command="close" commandfor="add-book-dialog">❌</button>
            </div>
            <div><label for="title">Title</label><input type="text" id="title"  name="title" required="required" minlength="1" maxlength="150"></div>
            <div><label for="author">Author</label><input type="text" id="author" name="author" required="required" minlength="1" maxlength="150"></div>
            <div>
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Choose a category</option>
                    <option value="Biography">Biography</option>
                    <option value="Children's-tales">Children's Tales</option>
                    <option value="Classic">Classic</option>
                    <option value="Crime">Crime</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="History">History</option>
                    <option value="Mystery">Mystery</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Romance">Romance</option>
                    <option value="Sci-fi">Sci-Fi</option>
                    <option value="Self-help">Self-help</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div><label for="pages">No. of Pages</label><input type="number" id="pages" name="pages" required="required" min="1"></div>
            <div><input type="checkbox" id="read" name="read" value="true"><label for="read">I have read the book</label></div>
            <button type="submit" command="">Submit</button>
        </form>
    </dialog>
</body>
</html>
